<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Temper City - Performance Metrics Report</title>
<style>
    html {
        scroll-behavior: smooth;
    }
    body {
        background-color: #121212;
        color: #FFFFFF;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.6;
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
    }
    h1, h2, h3 {
        color: #1DB954;
    }
    h1 {
        border-bottom: 2px solid #1DB954;
        padding-bottom: 10px;
    }
    h2, section, details {
        scroll-margin-top: 80px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        background-color: #181818;
    }
    th, td {
        padding: 12px;
        border: 1px solid #282828;
        text-align: left;
    }
    th {
        background-color: #282828;
        color: #1DB954;
    }
    tr:nth-child(even) {
        background-color: #151515;
    }
    ul {
        margin: 10px 0;
        padding-left: 20px;
    }
    li {
        margin-bottom: 5px;
    }
    p {
        margin: 10px 0;
    }
    strong {
        color: #1DB954;
    }
    .spotify-disclaimer {
        font-size: 13px;
        color: #FFFFFF;
        opacity: 0.85;
        margin: 6px 0 16px 0;
    }
    .restaurant-bill {
        margin: 20px 0;
    }
    .bill-table {
        width: 100%;
        max-width: 800px;
        border-collapse: collapse;
        margin: 15px 0 25px 0;
        background-color: #181818;
        border: 1px solid #282828;
        border-radius: 8px;
        overflow: hidden;
    }
    .bill-table th {
        padding: 10px 16px;
        background-color: #222222;
        color: #1DB954;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border: none;
        border-bottom: 2px solid #282828;
    }
    .bill-table th.platform {
        text-align: left;
    }
    .bill-table th.counter {
        text-align: right;
    }
    .bill-table th.daily-header {
        text-align: right;
    }
    .bill-table th.delta-header {
        text-align: center;
    }
    .bill-table th.unit {
        text-align: left;
    }
    .bill-table td {
        padding: 10px 16px;
        border: none;
        border-bottom: 1px solid #282828;
    }
    .bill-table .platform {
        font-weight: 500;
        text-align: left;
    }
    .bill-table .counter {
        text-align: right;
        font-weight: bold;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        font-size: 15px;
        color: #fff;
        direction: ltr;
    }
    .bill-table .daily-cell {
        text-align: right;
        font-weight: 600;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        font-size: 14px;
        color: #e5e5e5;
        direction: ltr;
    }
    .bill-table .delta-cell {
        text-align: center;
        white-space: nowrap;
    }
    .bill-table .delta {
        display: inline-block;
        font-size: 12px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 4px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        direction: ltr;
    }
    .bill-table .delta.positive {
        color: #10b981;
        background-color: rgba(16, 185, 129, 0.12);
        border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .bill-table .delta.negative {
        color: #ef4444;
        background-color: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.25);
    }
    .bill-table .delta.zero {
        color: #888888;
        background-color: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .bill-table .unit {
        color: #aaa;
        font-size: 13px;
        text-align: left;
        width: 140px;
    }
    .bill-table .subtotal-row {
        background-color: #1e1e1e;
        border-top: 1px solid #1DB954;
        border-bottom: 1px solid #1DB954;
        color: #1DB954;
        font-weight: bold;
    }
    .bill-table .subtotal-row .counter {
        color: #1DB954;
        font-size: 16px;
    }
    .bill-table .grand-row {
        background-color: #162419;
        border-top: 2px solid #1DB954;
        border-bottom: 2px solid #1DB954;
        color: #1DB954;
        font-weight: bold;
        font-size: 16px;
    }
    .bill-table .grand-row .counter {
        color: #1DB954;
        font-size: 18px;
    }

    /* Metric Badges & Performance Highlights */
    .metric-badge {
        display: inline-block;
        font-size: 11.5px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 4px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        margin: 0 3px;
        direction: ltr;
        unicode-bidi: isolate;
        vertical-align: middle;
        white-space: nowrap;
    }
    .metric-badge.positive {
        color: #10b981;
        background-color: rgba(16, 185, 129, 0.15);
        border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .metric-badge.negative {
        color: #ef4444;
        background-color: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .metric-badge.peak {
        color: #f59e0b;
        background-color: rgba(245, 158, 11, 0.15);
        border: 1px solid rgba(245, 158, 11, 0.35);
        font-weight: bold;
    }
    .metric-badge.neutral {
        color: #94a3b8;
        background-color: rgba(148, 163, 184, 0.1);
        border: 1px solid rgba(148, 163, 184, 0.2);
    }

    /* Hybrid Navigation & Accordion UI Styles */
    .sticky-nav {
        position: sticky;
        top: 0;
        z-index: 1000;
        background-color: rgba(18, 18, 18, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid #333333;
        padding: 12px 0;
        margin: 15px 0 25px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
    }
    .nav-links {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
    }
    .nav-links a {
        color: #FFD700;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        padding: 6px 14px;
        border-radius: 6px;
        background-color: #1f1f1f;
        border: 1px solid #333333;
        transition: all 0.2s ease;
    }

        color: #000000;
        background-color: #FFD700;
        border-color: #FFD7
