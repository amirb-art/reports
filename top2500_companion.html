<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spotify All-Time 2500 Companion</title>
    
    <!-- PWA & Web App Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1DB954">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="All-Time 2500">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='128' fill='%23121520'/%3E%3Ccircle cx='256' cy='256' r='180' fill='%231DB954'/%3E%3Cpath d='M160 210c65-20 135-15 192 15M175 260c50-15 110-10 160 15M190 310c40-10 85-8 125 10' stroke='%23ffffff' stroke-width='24' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">

    <style>
        :root {
            --bg-base: #0a0c13;
            --bg-card: #141724;
            --bg-card-hover: #1c2032;
            --accent-green: #1DB954;
            --accent-gold: #f5a623;
            --accent-cyan: #00d2ff;
            --text-primary: #ffffff;
            --text-secondary: #a3a8b8;
            --text-muted: #5e657a;
            --border-subtle: #24293d;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 10%, #171b2d 0%, var(--bg-base) 75%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 60px 16px;
            overflow-x: hidden;
        }

        .header-bar {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 12px 20px;
            background: rgba(20, 23, 36, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .spotify-dot {
            width: 14px;
            height: 14px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent-green);
            display: inline-block;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn:hover {
            background: var(--bg-card-hover);
            border-color: #3b4261;
            transform: translateY(-1px);
        }

        .btn-spotify {
            background: #1DB954;
            color: #000;
            border-color: #1DB954;
            font-weight: 700;
        }

        .btn-spotify:hover {
            background: #1ed760;
            box-shadow: 0 0 15px rgba(29, 185, 84, 0.4);
        }

        .btn-install {
            background: linear-gradient(135deg, #2b3252, #1d2238);
            color: #fff;
            border-color: #4a5482;
            display: none;
        }

        .main-card {
            width: 100%;
            max-width: 900px;
            background: rgba(20, 23, 36, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: 28px;
            padding: 36px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 28px;
            position: relative;
            overflow: hidden;
        }

        .card-ambient-glow {
            position: absolute;
            top: -100px;
            right: -100px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(29, 185, 84, 0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .now-playing-container {
            display: flex;
            gap: 32px;
            align-items: center;
            z-index: 1;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px 8px;
                min-height: 100dvh;
            }

            .header-bar {
                padding: 8px 12px;
                margin-bottom: 10px;
                border-radius: 12px;
            }

            .brand-title {
                font-size: 14px;
                gap: 8px;
            }

            .spotify-dot {
                width: 10px;
                height: 10px;
            }

            .header-actions .btn {
                padding: 6px 10px;
                font-size: 12px;
                border-radius: 8px;
            }

            .main-card {
                padding: 14px 12px;
                margin-bottom: 10px;
                border-radius: 16px;
            }

            /* Ultra-Compact Horizontal Media Row on Mobile */
            .now-playing-container {
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 12px;
                margin-bottom: 10px;
                text-align: left;
            }

            .album-art-wrapper {
                width: 92px;
                height: 92px;
                border-radius: 12px;
                flex-shrink: 0;
            }

            .track-details {
                gap: 3px;
                text-align: left;
                overflow: hidden;
            }

            .playing-status-pill {
                font-size: 10px;
                padding: 2px 7px;
                gap: 4px;
                margin: 0;
            }

            .eq-bar {
                width: 2px;
            }

            .track-title {
                font-size: 16px;
                line-height: 1.2;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }

            .track-artist {
                font-size: 13px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .progress-section {
                margin-top: 4px;
                gap: 3px;
            }

            .progress-bar-bg {
                height: 4px;
            }

            .progress-times {
                font-size: 10px;
            }

            /* 2x2 Balanced Grid on Mobile */
            .rank-showcase {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
                padding: 8px 6px;
                border-radius: 12px;
            }

            .stat-box {
                padding: 6px 4px;
                border-radius: 10px;
                text-align: center;
                align-items: center;
                gap: 2px;
                overflow: hidden;
            }

            .stat-label {
                font-size: 11px;
                justify-content: center;
                gap: 3px;
                white-space: nowrap;
            }

            .stat-value {
                font-size: clamp(13px, 3.8vw, 17px);
                line-height: 1.2;
            }

            .billion-badge,
            .age-badge {
                font-size: 9px;
                padding: 2px 5px;
                margin-top: 2px;
                letter-spacing: 0;
            }

            .search-section {
                margin-bottom: 8px;
            }

            .search-box {
                padding: 8px 12px;
                border-radius: 12px;
            }

            .search-input {
                font-size: 13px;
            }

            .footer-note {
                margin-top: 6px;
                font-size: 11px;
            }
        }

        .album-art-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            flex-shrink: 0;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .album-art {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .album-art-wrapper:hover .album-art {
            transform: scale(1.04);
        }

        .track-details {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
            direction: ltr;
            text-align: left;
        }

        .playing-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 12px;
            background: rgba(29, 185, 84, 0.15);
            color: var(--accent-green);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: fit-content;
        }

        .track-title {
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
            word-break: break-word;
        }

        .track-artist {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .progress-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
            direction: ltr;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-green), #20e068);
            border-radius: 4px;
            transition: width 0.3s linear;
        }

        .progress-times {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        /* Rank & Stats Showcase */
        .rank-showcase {
            background: rgba(13, 16, 27, 0.85);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            z-index: 1;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .stat-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-value {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
            direction: ltr;
            text-align: right;
        }

        .rank-gold {
            color: var(--accent-gold);
            text-shadow: 0 0 15px rgba(245, 166, 35, 0.3);
        }

        .billion-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 8px;
            background: rgba(245, 166, 35, 0.15);
            color: var(--accent-gold);
            font-size: 11px;
            font-weight: 800;
            margin-top: 4px;
            width: fit-content;
        }

        .age-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 8px;
            background: rgba(167, 139, 250, 0.15);
            color: #c4b5fd;
            font-size: 12px;
            font-weight: 800;
            margin-top: 4px;
            width: fit-content;
            direction: ltr;
        }

        /* Search & Catalog Section */
        .search-section {
            width: 100%;
            max-width: 900px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .search-box {
            width: 100%;
            position: relative;
        }

        .search-input {
            width: 100%;
            background: rgba(20, 23, 36, 0.9);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 16px 20px 16px 50px;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            outline: none;
            transition: all 0.2s ease;
            direction: ltr;
            text-align: left;
        }

        .search-input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 15px rgba(29, 185, 84, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 18px;
            pointer-events: none;
        }

        .search-results {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            max-height: 400px;
            overflow-y: auto;
            display: none;
            flex-direction: column;
        }

        .search-item {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.15s ease;
            direction: ltr;
        }

        .search-item:last-child {
            border-bottom: none;
        }

        .search-item:hover {
            background: var(--bg-card-hover);
        }

        .search-item-rank {
            font-size: 16px;
            font-weight: 800;
            color: var(--accent-gold);
            width: 60px;
        }

        .search-item-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .search-item-title {
            color: #fff;
            font-weight: 700;
            font-size: 15px;
        }

        .search-item-streams {
            color: var(--accent-cyan);
            font-size: 13px;
            font-weight: 600;
        }

        .play-row-btn {
            background: rgba(29, 185, 84, 0.16);
            border: 1px solid rgba(29, 185, 84, 0.45);
            color: var(--accent-green);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            flex-shrink: 0;
            margin-left: 12px;
            transition: all 0.18s ease;
        }

        .play-row-btn:hover {
            background: var(--accent-green);
            color: #0b0e17;
            transform: scale(1.08);
            box-shadow: 0 0 14px rgba(29, 185, 84, 0.45);
        }

        .play-all-bar {
            position: sticky;
            bottom: 0;
            background: rgba(13, 16, 27, 0.96);
            backdrop-filter: blur(8px);
            border-top: 1px solid rgba(29, 185, 84, 0.25);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .play-all-btn {
            background: linear-gradient(135deg, #1DB954 0%, #1ed760 100%);
            color: #0b0e17;
            border: none;
            border-radius: 999px;
            padding: 10px 26px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(29, 185, 84, 0.35);
            font-family: inherit;
        }

        .play-all-btn:hover {
            transform: translateY(-1px) scale(1.02);
            box-shadow: 0 6px 22px rgba(29, 185, 84, 0.5);
        }

        .player-toast {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(18, 22, 36, 0.96);
            border: 1px solid rgba(29, 185, 84, 0.45);
            color: #fff;
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 92vw;
            direction: rtl;
        }

        .player-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .player-toast.error {
            border-color: rgba(245, 166, 35, 0.6);
        }

        .toast-action-btn {
            background: var(--accent-green);
            color: #0b0e17;
            border: none;
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
        }

        /* Equalizer visualizer effect */
        .eq-bars {
            display: inline-flex;
            gap: 3px;
            align-items: flex-end;
            height: 14px;
        }

        .eq-bar {
            width: 3px;
            background: var(--accent-green);
            border-radius: 2px;
            animation: bounce 1s infinite alternate ease-in-out;
        }

        .eq-bar:nth-child(1) { height: 60%; animation-delay: 0.1s; }
        .eq-bar:nth-child(2) { height: 100%; animation-delay: 0.3s; }
        .eq-bar:nth-child(3) { height: 40%; animation-delay: 0.2s; }

        @keyframes bounce {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1); }
        }

        .footer-note {
            margin-top: 25px;
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="header-bar">
        <div class="brand-title">
            <span class="spotify-dot"></span>
            <span>All-Time 2500 Companion</span>
        </div>
        <div class="header-actions">
            <button id="installAppBtn" class="btn btn-install">
                <span>📲</span> התקן כאפליקציה
            </button>
            <button id="authSpotifyBtn" class="btn btn-spotify">
                <span>🎵</span> התחבר לספוטיפי
            </button>
        </div>
    </header>

    <!-- Main Showcase Card -->
    <main class="main-card">
        <div class="card-ambient-glow"></div>

        <div class="now-playing-container">
            <div class="album-art-wrapper">
                <img id="albumArt" class="album-art" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'%3E%3Crect width='300' height='300' fill='%23181c2b'/%3E%3Ctext x='50%25' y='50%25' fill='%234a5482' font-size='24' font-family='sans-serif' text-anchor='middle' dominant-baseline='middle'%3ENo Track Playing%3C/text%3E%3C/svg%3E" alt="Album Art">
            </div>

            <div class="track-details">
                <div id="playingBadge" class="playing-status-pill">
                    <div class="eq-bars">
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                    </div>
                    <span id="playingStatusText">Disconnected</span>
                </div>

                <h1 id="trackTitle" class="track-title">Waiting for playback...</h1>
                <h2 id="trackArtist" class="track-artist">Connect your Spotify account to start</h2>

                <div class="progress-section">
                    <div class="progress-bar-bg">
                        <div id="progressFill" class="progress-bar-fill"></div>
                    </div>
                    <div class="progress-times">
                        <span id="currentTime">0:00</span>
                        <span id="totalTime">0:00</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Metric Showcase -->
        <div class="rank-showcase">
            <div class="stat-box">
                <div class="stat-label">🏆 מיקום בכל הזמנים</div>
                <div id="rankValue" class="stat-value rank-gold">--</div>
                <div id="milestoneBadge" class="billion-badge" style="display:none;"></div>
            </div>

            <div class="stat-box">
                <div class="stat-label">🎧 סך השמעות (קוורב)</div>
                <div id="totalStreamsValue" class="stat-value">--</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">📈 קצב יומי</div>
                <div id="dailyStreamsValue" class="stat-value" style="color:var(--accent-cyan);">--</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">⏳ גיל השיר ותאריך יציאה</div>
                <div id="trackAgeValue" class="stat-value" style="color:#c4b5fd; direction:rtl; text-align:center;">--</div>
                <div id="releaseDateBadge" class="age-badge" style="display:none;"></div>
            </div>
        </div>
    </main>

    <!-- Instant Search Section -->
    <section class="search-section">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Search any of the 2,500 songs (artist or title)...">
        </div>
        <div id="searchResults" class="search-results"></div>
    </section>

    <footer class="footer-note">
        Spotify Most Streamed Songs of All Time • Updated Daily via Autonomous Pipeline
    </footer>

    <div id="playerToast" class="player-toast"></div>

            });

            return match || null;
        }

        function formatNumber(num) {
            return (num || 0).toLocaleString();
        }

        function formatTime(ms) {
            const totalSec = Math.floor(ms / 1000);
            const min = Math.floor(totalSec / 60);
            const sec = totalSec % 60;
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function formatReleaseDateAndAge(releaseDateStr, precision) {
            if (!releaseDateStr) return { dateText: "--", ageText: "" };

            const monthsShort = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const parts = releaseDateStr.split('-').map(p => parseInt(p, 10));
            const year = parts[0];
            if (!year || isNaN(year)) return { dateText: releaseDateStr, ageText: "" };

            const effPrecision = precision || (parts.length >= 3 ? 'day' : parts.length === 2 ? 'month' : 'year');
            const month = parts.length >= 2 && !isNaN(parts[1]) ? parts[1] : 1;
            const day = parts.length >= 3 && !isNaN(parts[2]) ? parts[2] : 1;

            let dateText = String(year);
            if (effPrecision === 'day' && parts.length >= 3) {
                const dd = day < 10 ? `0${day}` : `${day}`;
                dateText = `${dd} ${monthsShort[month - 1]} ${year}`;
            } else if (effPrecision === 'month' && parts.length >= 2) {
                dateText = `${monthsShort[month - 1]} ${year}`;
            }

            const now = new Date();
            const relDate = new Date(year, month - 1, day);
            if (relDate > now) {
                return { dateText, ageText: "טרם יצא" };
            }

            if (effPrecision === 'year') {
                const approxYears = now.getFullYear() - year;
                if (approxYears <= 0) return { dateText, ageText: "מהשנה" };
                if (approxYears === 1) return { dateText, ageText: "כשנה" };
                if (approxYears === 2) return { dateText, ageText: "כשנתיים" };
                return { dateText, ageText: `כ-${approxYears} שנים` };
            }

            let years = now.getFullYear() - relDate.getFullYear();
            let months = now.getMonth() - relDate.getMonth();
            let days = now.getDate() - relDate.getDate();

            if (days < 0) {
                months -= 1;
                const prevMonthLastDay = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
                days += prevMonthLastDay;
            }
            if (months < 0) {
                years -= 1;
                months += 12;
            }

            const fmtYears = (y) => (y === 1 ? "שנה" : y === 2 ? "שנתיים" : `${y} שנים`);
            const fmtMonths = (m) => (m === 1 ? "חודש" : m === 2 ? "חודשיים" : `${m} חודשים`);
            const fmtDays = (d) => (d === 1 ? "יום אחד" : d === 2 ? "יומיים" : `${d} ימים`);

            let ageText = "";
            if (years > 0 && months > 0) {
                const monthJoin = (months === 1 || months === 2) ? `ו${fmtMonths(months)}` : `ו-${fmtMonths(months)}`;
                ageText = `${fmtYears(years)} ${monthJoin}`;
            } else if (years > 0) {
                ageText = `בן ${fmtYears(years)}`;
            } else if (months > 0) {
                ageText = `${fmtMonths(months)}`;
            } else if (days > 0) {
                ageText = `${fmtDays(days)}`;
            } else {
                ageText = "יצא היום!";
            }

            return { dateText, ageText };
        }

        function setReleaseCard(releaseDateStr, precision) {
            const ageValueEl = document.getElementById('trackAgeValue');
            const releaseBadgeEl = document.getElementById('releaseDateBadge');
            if (!ageValueEl || !releaseBadgeEl) return;

            if (!releaseDateStr) {
                ageValueEl.textContent = "--";
                releaseBadgeEl.style.display = "none";
                return;
            }

            const { dateText, ageText } = formatReleaseDateAndAge(releaseDateStr, precision);
            ageValueEl.textContent = ageText || dateText;
            if (dateText && dateText !== "--") {
                releaseBadgeEl.textContent = `📅 ${dateText}`;
                releaseBadgeEl.style.display = "inline-flex";
            } else {
                releaseBadgeEl.style.display = "none";
            }
        }

        // Smart Polling Mechanism
        async function fetchCurrentlyPlaying() {
            const token = await getValidAccessToken();
            if (!token) return;

            try {
                const res = await fetch("https://api.spotify.com/v1/me/player/currently-playing", {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (res.status === 204 || res.status > 400) {
                    // Nothing playing or paused
                    updatePlaybackState(null);
                    scheduleNextPoll(12000); // Check again in 12s
                    return;
                }

                const data = await res.json();
                if (!data || !data.item) {
                    updatePlaybackState(null);
                    scheduleNextPoll(12000);
                    return;
                }

                updatePlaybackState(data);

                // Smart scheduling: poll near end of track or fallback
                if (data.is_playing) {
                    const remainingMs = (data.item.duration_ms || 180000) - (data.progress_ms || 0);
                    // Wake up 1.5s after current track ends, or check within max 30s
                    const nextCheckMs = Math.max(Math.min(remainingMs + 1500, 30000), 4000);
                    scheduleNextPoll(nextCheckMs);
                } else {
                    scheduleNextPoll(8000); // Paused, re-check in 8s
                }

            } catch (err) {
                console.error("Playback fetch error:", err);
                scheduleNextPoll(15000);
            }
        }

        function scheduleNextPoll(delayMs) {
            clearTimeout(pollingTimer);
            pollingTimer = setTimeout(fetchCurrentlyPlaying, delayMs);
        }

        function updatePlaybackState(spData) {
            const badge = document.getElementById('playingBadge');
            const statusText = document.getElementById('playingStatusText');
            const titleEl = document.getElementById('trackTitle');
            const artistEl = document.getElementById('trackArtist');
            const artEl = document.getElementById('albumArt');
            const rankEl = document.getElementById('rankValue');
            const totalStreamsEl = document.getElementById('totalStreamsValue');
            const dailyStreamsEl = document.getElementById('dailyStreamsValue');
            const milestoneBadge = document.getElementById('milestoneBadge');
            const progressFill = document.getElementById('progressFill');

            if (!spData || !spData.item) {
                statusText.textContent = "Standby / Paused";
                titleEl.textContent = "No Active Playback";
                artistEl.textContent = "Start listening on any device";
                rankEl.textContent = "--";
                totalStreamsEl.textContent = "--";
                dailyStreamsEl.textContent = "--";
                setReleaseCard(null, null);
                milestoneBadge.style.display = "none";
                progressFill.style.width = "0%";
                isTrackPlaying = false;
                return;
            }

            const item = spData.item;
            isTrackPlaying = spData.is_playing;
            localProgressMs = spData.progress_ms || 0;
            trackDurationMs = item.duration_ms || 1;

            statusText.textContent = isTrackPlaying ? "Now Playing" : "Paused";
            titleEl.textContent = item.name;
            artistEl.textContent = (item.artists || []).map(a => a.name).join(', ');

            if (item.album && item.album.images && item.album.images.length > 0) {
                artEl.src = item.album.images[0].url;
            }

            // Populate Release Date & Track Age from Spotify Album Metadata
            setReleaseCard(item.album?.release_date, item.album?.release_date_precision);

            // Cross reference with 2,500 catalog
            const matched = findTrackInCatalog(item.id, item.name, (item.artists || [])[0]?.name);
            if (matched) {
                rankEl.textContent = `#${matched.rank}`;
                totalStreamsEl.textContent = formatNumber(matched.streams);
                dailyStreamsEl.textContent = `+${formatNumber(matched.daily)}/day`;

                if (matched.streams >= 1000000000) {
                    milestoneBadge.style.display = "inline-flex";
                    milestoneBadge.textContent = "👑 BILLION CLUB MEMBER";
                } else {
                    const pct = ((matched.streams / 1000000000) * 100).toFixed(1);
                    milestoneBadge.style.display = "inline-flex";
                    milestoneBadge.textContent = `🚀 ${pct}% TO 1 BILLION`;
                }
            } else {
                rankEl.textContent = "2500+";
                totalStreamsEl.textContent = "< 725M";
                dailyStreamsEl.textContent = "--";
                milestoneBadge.style.display = "none";
            }
        }

        // Smooth Local Progress Animation
        setInterval(() => {
            if (isTrackPlaying && trackDurationMs > 0) {
                localProgressMs += 1000;
                if (localProgressMs > trackDurationMs) localProgressMs = trackDurationMs;
                const pct = (localProgressMs / trackDurationMs) * 100;
                document.getElementById('progressFill').style.width = `${pct}%`;
                document.getElementById('currentTime').textContent = formatTime(localProgressMs);
                document.getElementById('totalTime').textContent = formatTime(trackDurationMs);
            }
        }, 1000);

        function startPlayerMonitoring() {
            fetchCurrentlyPlaying();
        }

        // Floating Toast Feedback Helper
        function showPlayerToast(message, isError = false, showReconnect = false) {
            const toast = document.getElementById('playerToast');
            if (!toast) return;
            clearTimeout(toastTimer);
            toast.className = 'player-toast show' + (isError ? ' error' : '');
            if (showReconnect) {
                toast.innerHTML = `<span>${message}</span><button class="toast-action-btn" onclick="initiateSpotifyLogin()">אשר הרשאה</button>`;
            } else {
                toast.textContent = message;
            }
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, showReconnect ? 8000 : 3500);
        }

        // Spotify Remote Playback Engine (Single Track or Play All Queue)
        async function playSpotifyUris(uris, displayLabel) {
            if (!uris || uris.length === 0) {
                showPlayerToast('⚠️ לא נמצא מזהה Spotify תקין לשיר זה.', true);
                return;
            }
            if (!localStorage.getItem('sp_refresh_token')) {
                showPlayerToast('🔐 יש להתחבר לספוטיפיי כדי לנגן שירים.', true, true);
                return;
            }

            const token = await getValidAccessToken();
            if (!token) {
                showPlayerToast('🔐 פג תוקף החיבור לספוטיפיי — התחבר מחדש.', true, true);
                return;
            }

            const attemptPlay = async (deviceId = null) => {
                const url = deviceId
                    ? `https://api.spotify.com/v1/me/player/play?device_id=${encodeURIComponent(deviceId)}`
                    : `https://api.spotify.com/v1/me/player/play`;
                return fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ uris })
                });
            };

            try {
                let res = await attemptPlay();

                // If 404 (no active device), look up available Spotify devices and wake the first one
                if (res.status === 404) {
                    const devRes = await fetch('https://api.spotify.com/v1/me/player/devices', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (devRes.ok) {
                        const devData = await devRes.json();
                        const devices = (devData.devices || []).filter(d => !d.is_restricted);
                        if (devices.length > 0) {
                            res = await attemptPlay(devices[0].id);
                        }
                    }
                }

                if (res.ok || res.status === 204) {
                    showPlayerToast(`▶️ מנגן בספוטיפיי: ${displayLabel}`);
                    setTimeout(() => fetchCurrentlyPlaying(), 900);
                    return;
                }

                const errText = await res.text();
                if (res.status === 403 && /scope/i.test(errText)) {
                    showPlayerToast('🔐 נדרש אישור חד-פעמי להרשאת ניגון בספוטיפיי:', true, true);
                } else if (res.status === 403 && /premium/i.test(errText)) {
                    showPlayerToast('⚠️ שליטה מרחוק בנגן דורשת חשבון Spotify Premium.', true);
                } else if (res.status === 404) {
                    showPlayerToast('⚠️ לא נמצא נגן ספוטיפיי פתוח. פתח את ספוטיפיי במכשיר שלך ונסה שוב.', true);
                } else {
                    showPlayerToast(`⚠️ לא ניתן להתחיל ניגון (${res.status}).`, true);
                }
            } catch (err) {
                console.error('Playback command error:', err);
                showPlayerToast('⚠️ שגיאת תקשורת מול ספוטיפיי.', true);
            }
        }

        window.playSearchTrack = function(event, rank) {
            if (event) event.stopPropagation();
            const item = (window.TOP_2500_DATA || []).find(t => t.rank === rank);
            if (!item || !item.id) {
                showPlayerToast('⚠️ אין מזהה ספוטיפיי זמין לשיר זה.', true);
                return;
            }
            playSpotifyUris([`spotify:track:${item.id}`], `${item.artist} - ${item.title}`);
        };

        window.playAllSearchResults = function() {
            const playable = (lastSearchMatches || []).filter(m => m.id);
            if (playable.length === 0) {
                showPlayerToast('⚠️ אין שירים זמינים לניגון ברשימה.', true);
                return;
            }
            const uris = playable.map(m => `spotify:track:${m.id}`);
            playSpotifyUris(uris, `${playable.length} שירים מתוצאות החיפוש`);
            searchResults.style.display = 'none';
        };

        // Instant Search Feature
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (query.length < 2) {
                lastSearchMatches = [];
                searchResults.style.display = 'none';
                searchResults.innerHTML = '';
                return;
            }

            const matches = (window.TOP_2500_DATA || [])
                .filter(t => (t.title && t.title.toLowerCase().includes(query)) || 
                             (t.artist && t.artist.toLowerCase().includes(query)))
                .slice(0, 25);
            lastSearchMatches = matches;

            if (matches.length === 0) {
                searchResults.innerHTML = '<div style="padding:15px; color:#a3a8b8; text-align:center;">No songs found in Top 2,500</div>';
                searchResults.style.display = 'flex';
                return;
            }

            const playableCount = matches.filter(m => m.id).length;
            const rowsHtml = matches.map(m => `
                <div class="search-item" onclick="selectSearchItem(${m.rank})">
                    <span class="search-item-rank">#${m.rank}</span>
                    <div class="search-item-info">
                        <span class="search-item-title">${m.artist} - ${m.title}</span>
                        <span class="search-item-streams">${formatNumber(m.streams)} Streams (+${formatNumber(m.daily)}/day)</span>
                    </div>
                    ${m.id ? `<button class="play-row-btn" title="נגן בספוטיפיי" onclick="playSearchTrack(event, ${m.rank})">▶</button>` : ''}
                </div>
            `).join('');

            const playAllHtml = playableCount > 0 ? `
                <div class="play-all-bar">
                    <button class="play-all-btn" onclick="playAllSearchResults()">
                        <span>▶</span>
                        <span>Play All (${playableCount} שירים)</span>
                    </button>
                </div>
            ` : '';

            searchResults.innerHTML = rowsHtml + playAllHtml;
            searchResults.style.display = 'flex';
        });

        window.selectSearchItem = async function(rank) {
            const item = (window.TOP_2500_DATA || []).find(t => t.rank === rank);
            if (!item) return;

            document.getElementById('rankValue').textContent = `#${item.rank}`;
            document.getElementById('totalStreamsValue').textContent = formatNumber(item.streams);
            document.getElementById('dailyStreamsValue').textContent = `+${formatNumber(item.daily)}/day`;
            document.getElementById('trackTitle').textContent = item.title;
            document.getElementById('trackArtist').textContent = item.artist;
            document.getElementById('playingStatusText').textContent = "Selected from Search";
            setReleaseCard(null, null);

            const milestoneBadge = document.getElementById('milestoneBadge');
            if (item.streams >= 1000000000) {
                milestoneBadge.style.display = "inline-flex";
                milestoneBadge.textContent = "👑 BILLION CLUB MEMBER";
            } else {
                const pct = ((item.streams / 1000000000) * 100).toFixed(1);
                milestoneBadge.style.display = "inline-flex";
                milestoneBadge.textContent = `🚀 ${pct}% TO 1 BILLION`;
            }

            searchResults.style.display = 'none';
            searchInput.value = '';

            // Enrich selected search track with live Spotify Release Date, Age & Cover Art
            if (item.id && localStorage.getItem('sp_refresh_token')) {
                try {
                    const token = await getValidAccessToken();
                    if (token) {
                        const res = await fetch(`https://api.spotify.com/v1/tracks/${item.id}`, {
                            headers: { "Authorization": `Bearer ${token}` }
                        });
                        if (res.ok) {
                            const trackData = await res.json();
                            if (trackData.album) {
                                setReleaseCard(trackData.album.release_date, trackData.album.release_date_precision);
                                if (trackData.album.images && trackData.album.images.length > 0) {
                                    document.getElementById('albumArt').src = trackData.album.images[0].url;
                                }
                            }
                        }
                    }
                } catch (err) {
                    console.warn("Could not fetch Spotify track metadata for search item:", err);
                }
            }
        };

        // Initialization
        document.getElementById('authSpotifyBtn').addEventListener('click', initiateSpotifyLogin);

        // Fallback dataset loader if embedded array is empty
        async function ensureDatasetLoaded() {
            if (!window.TOP_2500_DATA || window.TOP_2500_DATA.length === 0) {
                try {
                    const res = await fetch("top2500_data.json");
                    if (res.ok) {
                        window.TOP_2500_DATA = await res.json();
                        console.log("Loaded 2,500 songs dataset via JSON:", window.TOP_2500_DATA.length);
                    }
                } catch (e) {
                    console.warn("Could not load external top2500_data.json:", e);
                }
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await ensureDatasetLoaded();

            // Check URL for OAuth callback code
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (code) {
                // Clear URL parameters immediately to prevent stale re-submission on reload
                window.history.replaceState({}, document.title, window.location.pathname);
                await exchangeCodeForTokens(code);
            } else if (localStorage.getItem('sp_refresh_token')) {
                updateAuthButtonState(true);
                startPlayerMonitoring();
            }
        });
    </script>
